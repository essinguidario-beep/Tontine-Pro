# Configuration Netlify pour TontinePro Lite
# Redirection SPA pour React Router / Navigation d'application mono-page

[build]
  command = "npm run build"
  publish = "dist"

# Redirection vers index.html pour toutes les routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP de sécurité et performance
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"
